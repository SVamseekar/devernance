# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit is free for public repositories. While this repository has fewer
# than 10 stars, reviews must be triggered manually: comment
# "@coderabbitai review" on a pull request.
language: "en-GB"
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
