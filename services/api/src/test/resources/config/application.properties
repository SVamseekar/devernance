# Loaded on top of src/main/resources/application.properties (classpath:/config/ wins), so tests run with the
# production defaults and override only what they must. A file at the classpath root would replace it instead.

assurance.eval.callback.secret=test-eval-callback-secret
assurance.eval.worker.enabled=false
assurance.reg-monitor.enabled=false
assurance.reg-monitor.bootstrap-fixtures=true
assurance.demo.public-claims=false
assurance.bootstrap.seed-demo-users=true
assurance.evgraph.allow-runtime-install=true
assurance.app.base-url=http://localhost:3000
assurance.email.mode=log
assurance.frameworks.serve-unreviewed=true
# The suite reuses one Spring context and a handful of API keys; the per-caller budget has its own unit test.
assurance.security.api-rate.per-caller-per-minute=1000000
assurance.security.api-rate.expensive-per-workspace-per-minute=1000000
