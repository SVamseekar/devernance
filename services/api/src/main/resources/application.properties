spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.jackson.mapper.accept-case-insensitive-enums=true
spring.datasource.url=jdbc:h2:mem:eu_ai_assurance;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
assurance.evidence.embedding-provider=local-hash
# Local H2 demo users (compliance@example.com, admin@example.com, ...). Never true in production.
assurance.bootstrap.seed-demo-users=${ASSURANCE_SEED_DEMO_USERS:true}
assurance.evidence.max-content-characters=200000
assurance.evidence.max-metadata-entries=25
assurance.evidence.max-metadata-value-characters=1000
assurance.evidence.max-question-characters=2048
assurance.evidence.max-retrieved-chunks=3
assurance.evidence.min-retrieval-score=0.20
assurance.evidence.allowed-source-schemes=memory,s3,gs,https
assurance.eval.worker.enabled=true
assurance.eval.worker.poll-interval-ms=5000
assurance.eval.callback.secret=${EVAL_CALLBACK_SECRET:}
assurance.eval.callback.signature-tolerance-seconds=300
assurance.audit.chain-secret=${AUDIT_CHAIN_SECRET:local-dev-audit-chain-secret}
assurance.audit.retention-years=7
assurance.evidence-pack.generator=devernance-api/0.1.0
# Certification readiness (Part 13) — score + gaps only; never legal certification
assurance.certification-readiness.ready-for-review-threshold=90
assurance.certification-readiness.not-ready-score-floor=50
assurance.certification-readiness.evidence-pass-threshold=82
assurance.certification-readiness.eval-pass-threshold=85
assurance.certification-readiness.eval-hard-block-threshold=78
assurance.certification-readiness.weight-risk=10
assurance.certification-readiness.weight-controls=15
assurance.certification-readiness.weight-evidence=15
assurance.certification-readiness.weight-eval=15
assurance.certification-readiness.weight-contracts=10
assurance.certification-readiness.weight-approvals=10
assurance.certification-readiness.weight-oversight=10
assurance.certification-readiness.weight-determination=10
assurance.certification-readiness.weight-audit-chain=5
# Regulatory change monitoring (Part 14) — polled assistive feed, not official legal bulletin
assurance.reg-monitor.enabled=true
assurance.reg-monitor.poll-interval-ms=60000
assurance.reg-monitor.bootstrap-fixtures=true
# English Formex corpus. Flyway V18 creates the tables; this runner loads the bundled extracts on boot.
assurance.corpus.bootstrap=true
assurance.corpus.as-of=
# Empty means the rules mapper fills the queue and the proposals screen shows the SLM-down banner.
assurance.slm.map-endpoint=
assurance.reg-monitor.max-fetch-characters=2000000
assurance.reg-monitor.connect-timeout-seconds=10
assurance.reg-monitor.response-timeout-seconds=30
# Sector packs (Part 15) — SPI + insurance/hr/finance verticals; not all industries / no live vendors
assurance.sector.packs=insurance,hr,finance
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Histogram buckets for NFR latency timers (p95 via Prometheus quantile queries — not unit-test SLOs)
management.metrics.distribution.percentiles-histogram.assurance.api.registry.read=true
management.metrics.distribution.percentiles-histogram.assurance.api.evidence.query=true
# Object storage (S3 / MinIO). Disabled by default; see docs/DEPLOYMENT.md Part 9.
assurance.storage.enabled=${ASSURANCE_STORAGE_ENABLED:false}
assurance.storage.bucket=${ASSURANCE_STORAGE_BUCKET:eu-ai-assurance-evidence}
assurance.storage.region=${ASSURANCE_STORAGE_REGION:eu-west-1}
assurance.storage.endpoint=${ASSURANCE_STORAGE_ENDPOINT:}
assurance.storage.access-key-id=${ASSURANCE_STORAGE_ACCESS_KEY_ID:}
assurance.storage.secret-access-key=${ASSURANCE_STORAGE_SECRET_ACCESS_KEY:}
# Optional path-style override via ASSURANCE_STORAGE_PATH_STYLE (true/false).
# When unset, path-style is auto-enabled whenever endpoint is non-blank (MinIO).

# OAuth / OIDC (Part 4). auto-provision MUST stay false in production unless intentionally opened.
assurance.oauth.auto-provision=${OAUTH_AUTO_PROVISION:false}
assurance.oauth.redirect-base-url=${OAUTH_REDIRECT_BASE_URL:http://localhost:3000}
assurance.oauth.state-secret=${OAUTH_STATE_SECRET:${AUDIT_CHAIN_SECRET:local-dev-oauth-state-secret}}
assurance.oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:}
assurance.oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:}
assurance.oauth.microsoft.client-id=${OAUTH_MICROSOFT_CLIENT_ID:}
assurance.oauth.microsoft.client-secret=${OAUTH_MICROSOFT_CLIENT_SECRET:}
# Platform operator tenant may provision customer tenants (sales-led onboarding).
assurance.platform.operator-tenant-id=${ASSURANCE_OPERATOR_TENANT_ID:00000000-0000-0000-0000-000000000001}
assurance.platform.invite-ttl-hours=${ASSURANCE_INVITE_TTL_HOURS:72}
# Public-claims teasers (named EU orgs from public pages). Local demos only. Never
# enable for customer tenants: the teasers name real companies.
assurance.demo.public-claims=${ASSURANCE_PUBLIC_CLAIMS:false}
assurance.gate.manual-inputs=${ASSURANCE_GATE_MANUAL_INPUTS:true}
# Framework crosswalks whose reviewedBy is empty are served for preview here; the postgres profile hides them.
assurance.frameworks.serve-unreviewed=${ASSURANCE_FRAMEWORKS_SERVE_UNREVIEWED:true}
assurance.evgraph.allow-runtime-install=${ASSURANCE_EVGRAPH_ALLOW_RUNTIME_INSTALL:false}

# Authentication rate limits (Finding F13)
assurance.security.trust-client-ip-header=${ASSURANCE_SECURITY_TRUST_CLIENT_IP_HEADER:false}
assurance.security.auth-rate.per-ip-per-15m=${ASSURANCE_AUTH_RATE_PER_IP:30}
assurance.security.auth-rate.per-email-per-15m=${ASSURANCE_AUTH_RATE_PER_EMAIL:10}

# JWT private key encryption at rest (Finding F15)
assurance.auth.key-encryption-secret=${JWT_KEY_ENCRYPTION_SECRET:}

# Parallel dashboard requests may present the same refresh token; reuse within this window is not theft.
assurance.auth.refresh-reuse-grace-seconds=${ASSURANCE_REFRESH_REUSE_GRACE_SECONDS:30}

assurance.app.base-url=${ASSURANCE_APP_BASE_URL:http://localhost:3000}
assurance.email.mode=${ASSURANCE_EMAIL_MODE:log}
assurance.email.from=${ASSURANCE_EMAIL_FROM:Devernance <no-reply@localhost>}
# Primary: Resend SMTP (host smtp.resend.com, port 587, user "resend", password = Resend API key)
assurance.email.primary.host=${ASSURANCE_SMTP_PRIMARY_HOST:}
assurance.email.primary.port=${ASSURANCE_SMTP_PRIMARY_PORT:587}
assurance.email.primary.username=${ASSURANCE_SMTP_PRIMARY_USERNAME:}
assurance.email.primary.password=${ASSURANCE_SMTP_PRIMARY_PASSWORD:}
# Fallback: OCI Email Delivery SMTP (host smtp.email.<region>.oci.oraclecloud.com, port 587, SMTP credentials)
assurance.email.fallback.host=${ASSURANCE_SMTP_FALLBACK_HOST:}
assurance.email.fallback.port=${ASSURANCE_SMTP_FALLBACK_PORT:587}
assurance.email.fallback.username=${ASSURANCE_SMTP_FALLBACK_USERNAME:}
assurance.email.fallback.password=${ASSURANCE_SMTP_FALLBACK_PASSWORD:}
assurance.demo.enabled=${ASSURANCE_DEMO_ENABLED:false}

# Dodo Payments (billing). Blank values leave billing unconfigured; webhooks are refused without a secret.
assurance.dodo.base-url=${DODO_BASE_URL:https://test.dodopayments.com}
assurance.dodo.api-key=${DODO_API_KEY:}
assurance.dodo.webhook-secret=${DODO_WEBHOOK_SECRET:}
assurance.dodo.product-team-monthly=${DODO_PRODUCT_TEAM_MONTHLY:}
assurance.dodo.product-team-yearly=${DODO_PRODUCT_TEAM_YEARLY:}
assurance.dodo.product-business-monthly=${DODO_PRODUCT_BUSINESS_MONTHLY:}
assurance.dodo.product-business-yearly=${DODO_PRODUCT_BUSINESS_YEARLY:}
assurance.dodo.return-url=${assurance.app.base-url:http://localhost:3000}/settings?billing=return
assurance.dodo.business-id=${DODO_BUSINESS_ID:}
