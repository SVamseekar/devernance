spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/eu_ai_assurance}
spring.datasource.username=${DATABASE_USERNAME:eu_ai_assurance}
spring.datasource.password=${DATABASE_PASSWORD:eu_ai_assurance}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration,classpath:db/postgresql
assurance.evidence.embedding-provider=${EVIDENCE_EMBEDDING_PROVIDER:djl-sentence}
assurance.eval.callback.secret=${EVAL_CALLBACK_SECRET:}
assurance.demo.public-claims=${ASSURANCE_PUBLIC_CLAIMS:false}
assurance.gate.manual-inputs=${ASSURANCE_GATE_MANUAL_INPUTS:false}
assurance.frameworks.serve-unreviewed=${ASSURANCE_FRAMEWORKS_SERVE_UNREVIEWED:false}
assurance.bootstrap.seed-demo-users=${ASSURANCE_SEED_DEMO_USERS:false}

# Self-serve sign-up: safe because only provider-verified emails reach provisioning and each creates its own tenant.
assurance.oauth.auto-provision=${OAUTH_AUTO_PROVISION:true}
