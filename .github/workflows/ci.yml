name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        # Local-only: no-commit-to-branch (CI is detached HEAD / main).
        # History scan already runs as the dedicated Secret scan job.
        # Run against the PR/push diff, not the whole tree — existing files
        # are not rewritten.
        env:
          SKIP: no-commit-to-branch,gitleaks
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            pre-commit run --from-ref "origin/${BASE_REF}" --to-ref HEAD --show-diff-on-failure
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            pre-commit run --from-ref "$BEFORE_SHA" --to-ref "$HEAD_SHA" --show-diff-on-failure
          else
            pre-commit run --all-files --show-diff-on-failure
          fi

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      terraform: ${{ steps.filter.outputs.terraform }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'apps/dashboard/**'
              - '.github/workflows/ci.yml'
            terraform:
              - 'infra/terraform/**'
              - 'scripts/terraform-validate.sh'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.dockerignore'
              - 'services/api/src/main/resources/application*.properties'
              - '.github/workflows/ci.yml'
              - '.github/workflows/images.yml'

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api-test:
    name: API tests
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      # H2 tests must not require production secrets
      EVAL_CALLBACK_SECRET: ""
    steps:
      - uses: actions/checkout@v7

      - name: Skip — no API changes
        if: needs.changes.outputs.api != 'true' && github.event_name == 'pull_request'
        run: echo "No API changes in this PR; job is a no-op for path filter."

      # Always run on main pushes so the default branch stays green
      - uses: actions/setup-java@v6
        if: needs.changes.outputs.api == 'true' || github.event_name != 'pull_request'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/api/pom.xml

      - name: Run Maven tests
        if: needs.changes.outputs.api == 'true' || github.event_name != 'pull_request'
        run: mvn -B test

      - name: Upload Surefire reports
        if: always() && (needs.changes.outputs.api == 'true' || github.event_name != 'pull_request')
        uses: actions/upload-artifact@v7
        with:
          name: api-surefire-reports
          path: services/api/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  api-postgres:
    name: API on Postgres (Flyway + smoke)
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: eu_ai_assurance
          POSTGRES_USER: eu_ai_assurance
          POSTGRES_PASSWORD: eu_ai_assurance
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eu_ai_assurance -d eu_ai_assurance"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: services/api
    env:
      RUN_POSTGRES_SMOKE: "true"
      DATABASE_URL: jdbc:postgresql://localhost:5432/eu_ai_assurance
      DATABASE_USERNAME: eu_ai_assurance
      DATABASE_PASSWORD: eu_ai_assurance
      EVAL_CALLBACK_SECRET: ci-eval-callback-secret-for-postgres-smoke-only
      AUDIT_CHAIN_SECRET: ci-audit-chain-secret-for-postgres-smoke-only
      OAUTH_STATE_SECRET: ci-oauth-state-secret-for-postgres-smoke-only
      JWT_KEY_ENCRYPTION_SECRET: ci-jwt-key-encryption-secret-for-postgres-smoke
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/api/pom.xml
      - name: Postgres smoke (Flyway V1–V22 + bootstrap + guards)
        run: mvn -B test -Dtest=PostgresProfileSmokeTest

  acceptance:
    name: Acceptance (Claims Triage)
    needs: changes
    runs-on: ubuntu-latest
    # Optional PR gate: runs when API changes (or always on main). Branch protection can require this check.
    defaults:
      run:
        working-directory: services/api
    env:
      EVAL_CALLBACK_SECRET: ""
    steps:
      - uses: actions/checkout@v7

      - name: Skip — no API changes
        if: needs.changes.outputs.api != 'true' && github.event_name == 'pull_request'
        run: echo "No API changes in this PR; acceptance is a no-op for path filter."

      - uses: actions/setup-java@v6
        if: needs.changes.outputs.api == 'true' || github.event_name != 'pull_request'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/api/pom.xml

      - name: Run ClaimsTriageAcceptanceTest
        if: needs.changes.outputs.api == 'true' || github.event_name != 'pull_request'
        run: mvn -B test -Dtest=ClaimsTriageAcceptanceTest

      - name: Upload acceptance Surefire reports
        if: always() && (needs.changes.outputs.api == 'true' || github.event_name != 'pull_request')
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-surefire-reports
          path: services/api/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  dashboard-build:
    name: Dashboard checks
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    env:
      NEXT_PUBLIC_SITE_URL: https://euassuranceai.souravamseekar.com
      # Build must not require a live API
      ASSURANCE_API_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7

      - name: Skip — no dashboard changes
        if: needs.changes.outputs.dashboard != 'true' && github.event_name == 'pull_request'
        run: echo "No dashboard changes in this PR; job is a no-op for path filter."

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.dashboard == 'true' || github.event_name != 'pull_request'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.dashboard == 'true' || github.event_name != 'pull_request'
        run: npm ci

      - name: Typecheck
        if: needs.changes.outputs.dashboard == 'true' || github.event_name != 'pull_request'
        run: npx tsc --noEmit

      - name: Unit tests
        if: needs.changes.outputs.dashboard == 'true' || github.event_name != 'pull_request'
        run: npm test

      - name: Production build
        if: needs.changes.outputs.dashboard == 'true' || github.event_name != 'pull_request'
        run: npm run build

  # Part 9: validate Terraform skeleton without cloud credentials (null provider only).
  infra-test:
    name: Infra tests (compose, backups, updater)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Skip — no infra changes
        if: needs.changes.outputs.infra != 'true' && github.event_name == 'pull_request'
        run: echo "No infra changes; job is a no-op for path filter."

      - name: Shellcheck, compose contract, backup and updater tests, backup round trip
        if: needs.changes.outputs.infra == 'true' || github.event_name != 'pull_request'
        env:
          RUN_DOCKER_TESTS: "1"
        run: infra/test/run.sh

  terraform-validate:
    name: Terraform validate
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Skip — no Terraform changes
        if: needs.changes.outputs.terraform != 'true' && github.event_name == 'pull_request'
        run: echo "No Terraform skeleton changes; job is a no-op for path filter."

      - uses: hashicorp/setup-terraform@v4
        if: needs.changes.outputs.terraform == 'true' || github.event_name != 'pull_request'
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: fmt + init + validate
        if: needs.changes.outputs.terraform == 'true' || github.event_name != 'pull_request'
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  e2e:
    name: E2E (login → register → evidence)
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.dashboard == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVAL_CALLBACK_SECRET: ci-eval-callback-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/api/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned evgraph CLI (same hashes as the production image)
        run: |
          python -m venv "$RUNNER_TEMP/evgraph"
          "$RUNNER_TEMP/evgraph/bin/pip" install --require-hashes -r infra/evgraph-requirements.txt
          "$RUNNER_TEMP/evgraph/bin/evgraph" --help > /dev/null
          echo "EVGRAPH_BIN=$RUNNER_TEMP/evgraph/bin/evgraph" >> "$GITHUB_ENV"
      - name: Start API (H2, seeded demo users)
        working-directory: services/api
        env:
          # The public site's "Try the live demo" button is covered by the E2E suite.
          ASSURANCE_DEMO_ENABLED: "true"
        run: |
          mvn -B -q -DskipTests package
          nohup java -jar target/api-*.jar > api.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/actuator/health && break; sleep 3; done
          curl -fsS http://localhost:8080/actuator/health > /dev/null || { tail -50 api.log; exit 1; }
      - name: Build and start dashboard
        working-directory: apps/dashboard
        env:
          ASSURANCE_API_BASE_URL: http://localhost:8080
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # A production build refuses signup without a Turnstile secret; this opts the test run out explicitly.
          TURNSTILE_DISABLED: "1"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npm start > web.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://localhost:3000/login > /dev/null && break; sleep 3; done
      - name: Run E2E
        working-directory: apps/dashboard
        run: npm run e2e
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            services/api/api.log
            apps/dashboard/web.log
            apps/dashboard/test-results/
