name: Deploy site

# Deploy apps/dashboard to the Cloudflare Worker `devernance-site` (devernance.space) after CI passes on main, so a
# red commit never reaches production. Runbook: docs/DEPLOYMENT.md, section C.
#
# Needs the repository secret CLOUDFLARE_API_TOKEN (Cloudflare template "Edit Cloudflare Workers") and the repository
# variable CLOUDFLARE_ACCOUNT_ID. Without the token the job skips with a warning instead of failing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/dashboard
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check credentials
        id: creds
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable is not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Build worker (OpenNext)
        if: steps.creds.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_SITE_URL: https://devernance.space
        run: npx opennextjs-cloudflare build

      - name: Refuse local env values in the worker
        if: steps.creds.outputs.ready == 'true'
        run: |
          cat .open-next/cloudflare/next-env.mjs
          if grep -q 'localhost' .open-next/cloudflare/next-env.mjs; then
            echo "::error::The worker would ship localhost values; check for committed .env files."
            exit 1
          fi

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler deploy

      - name: Smoke test
        if: steps.creds.outputs.ready == 'true'
        working-directory: .
        run: |
          sleep 10
          curl -fsS -o /dev/null -w "devernance.space: HTTP %{http_code}\n" https://devernance.space/
          curl -fsS https://devernance.space/sitemap.xml | grep -q '<loc>https://devernance.space' \
            || { echo "::error::sitemap does not list devernance.space"; exit 1; }
