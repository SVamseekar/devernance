[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devernance"
version = "0.1.0"
description = "CLI and Python SDK for the Devernance AI governance control plane"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.scripts]
devernance = "devernance.cli:main"

[tool.setuptools]
packages = ["devernance"]
